<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empire Chatbot</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="chatbot.css">
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-dark  ">
    <div class="container">
      <a class="navbar-brand" href="index.html">An Empire</a>
 
    </div>
  </nav>
  <div class="container chat-container">
    <div class="chat-box" id="chatBox">
      <div class="chat-header">AnEmpire Help Guide</div>
      <p class="px-3 pt-2 mb-1 small">Offline answers only. No live AI, customer support, orders, or payment service.</p>
      <div class="chat-body" id="chatBody" role="log" aria-label="Help conversation" aria-live="polite"></div>
      <div class="chat-input">
        <input type="text" id="userInput" maxlength="500" aria-label="Ask AnEmpire help guide" placeholder="Ask about products, accounts, or support">
        <button id="sendBtn" type="button">Send</button>
      </div>
    </div>
  </div>
  <script src="chatbot.js"></script>
</body>

</html>
