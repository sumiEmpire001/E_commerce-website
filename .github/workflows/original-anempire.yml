name: Original AnEmpire checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check chatbot.js
      - run: node --check auth-flow.js
      - run: node --check auth-api.mjs
      - run: node --check auth-config.mjs
      - run: node --check anempire-config.js
      - run: node --check marketplace-data.mjs
      - run: node --check marketplace-app.mjs
      - run: node --test tests/original-flow.test.mjs tests/marketplace.test.mjs tests/chatbot.test.mjs
