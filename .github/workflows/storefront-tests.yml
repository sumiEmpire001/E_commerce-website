name: AnEmpire storefront checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run storefront unit tests
        run: node --test tests/storefront.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check storefront/catalog.mjs
          node --check storefront/app.mjs
