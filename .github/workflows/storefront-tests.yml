name: AnEmpire storefront checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Unit and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/storefront.test.mjs
      - run: |
          node --check storefront/catalog.mjs
          node --check storefront/app.mjs
  browser:
    name: Desktop and mobile Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: npm install --no-package-lock --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
